        <style>

            #dorianmayforever {
            width: 80%;
            max-width: 600px;

            /* --- 动画核心参数 --- */

            /*
            关键！这是您SVG路径的大约总长度。
            我为您估算了一个值，但强烈建议您获取精确值。
            方法：在浏览器开发者工具的控制台中运行下面这行代码：
            document.querySelector('#signature-path').getTotalLength()
            然后用返回的精确数字替换下面的值。
            */
            --path-length: 1000;

            /* 动画播放一次的总时长 */
            --animation-duration: 8s;
            }

            /* 选中需要动画的路径 */
            .signature-path {
            /* 动画属性 */
            stroke-dasharray: var(--path-length);
            stroke-dashoffset: var(--path-length);

            /*
            让动画从头到尾播放，然后停在最后一帧（forwards）。
            动画会无限循环播放（infinite）。
            */
            animation: draw-and-erase var(--animation-duration) ease-in-out forwards infinite;

            }

            /*
            定义动画关键帧：
            这个动画会先绘制，暂停一下，然后擦除。
            */
            @keyframes draw-and-erase {
            0% {
            opacity: 0;
            stroke-dashoffset: var(--path-length); /* 动画开始，路径完全不可见 */
            }
            5% {
            opacity: 1; /* 快速渐显，准备绘制 */
            }
            50% {
            stroke-dashoffset: 0; /* 动画进行到一半，路径绘制完成 */
            }
            70% {
            stroke-dashoffset: 0; /* 保持绘制完成的状态，让用户看清楚 */
            }
            95%, 100% {
            opacity: 1;
            stroke-dashoffset: var(--path-length); /* 动画结尾，路径被“擦除”，为下一次循环做准备 */
            }
            }
        </style>
    </defs>
</svg>
